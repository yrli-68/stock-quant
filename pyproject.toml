[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-quant"
version = "1.0.0"
description = "股票量化分析工具：分析、回测、扫描、策略对比、钉钉通知"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "mplfinance>=0.12.10b0",
    "scipy>=1.10.0",
    "tabulate>=0.9.0",
    "requests>=2.28.0",
    "PyMySQL>=1.0.0",
    "akshare>=1.14.0",
    "yfinance>=0.2.40",
]

[project.scripts]
stock-quant = "main:cli"

[tool.setuptools]
py-modules = ["main"]
packages = ["core", "strategies", "visualization"]

[tool.setuptools.package-data]
core = ["*.py"]
strategies = ["*.py"]
visualization = ["*.py"]
